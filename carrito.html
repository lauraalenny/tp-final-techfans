<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEO Básico -->
    <meta name="description" content="Revisá los productos seleccionados en tu carrito de compras de TechFans, editá cantidades y calculá tu total.">
    <title>TechFans - Tu Carrito de Compras</title>
    
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="main-header">
        <h1>TechFans</h1>
        <nav class="nav-bar" aria-label="Navegación principal">
            <ul class="nav-list">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="resenas.html">Reseñas</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="carrito.html" class="cart-link active" aria-current="page" aria-label="Ver carrito de compras">🛒 Carrito (<span id="cart-count">0</span>)</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="cart-section">
            <h2>Tu Carrito de Compras</h2>
            
            <!-- Lista dinámica inyectada por script.js -->
            <div id="cart-items-container" class="cart-items-list" aria-live="polite"></div>

            <!-- Resumen y Total Dinámico -->
            <div class="cart-summary">
                <p class="cart-total-text">Total a pagar: <strong>$<span id="cart-total">0.00</span></strong></p>

                <div class="cart-actions">
                    <button id="btn-clear-cart" class="btn-clear">Vaciar Carrito</button>
                    <a href="productos.html" class="btn-continue">Seguir Comprando</a>
                </div>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 TechFans. Todos los derechos reservados.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
